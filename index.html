<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Under Construction | Refined Mobile Detailing</title>
        <link href="resources/css/style.css" type="text/css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <style>
            /* Specific overrides for the under construction page */
            body.construction-page {
                margin: 0;
                padding: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                background-image: url('./resources/images/soapy-car.jpg');
                background-size: cover;
                background-position: center;
                position: relative;
                color: white;
                font-family: sans-serif;
            }

            body.construction-page::before {
                content: '';
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0, 0, 0, 0.75); /* Dark overlay to match your hero section vibe */
                z-index: 1;
            }

            .construction-container {
                position: relative;
                z-index: 2;
                margin: auto;
                text-align: center;
                padding: 40px 20px;
                max-width: 600px;
            }

            .construction-card {
                background: rgba(34, 34, 34, 0.85);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                padding: 50px 30px;
                border-radius: 12px;
                box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            }

            .construction-card i {
                color: #10b981; /* Accent green */
                margin-bottom: 20px;
            }

            .construction-card h1 {
                font-size: 2.5rem;
                margin-bottom: 15px;
                letter-spacing: 1px;
            }

            .construction-card p {
                font-size: 1.1rem;
                color: #ccc;
                line-height: 1.6;
                margin-bottom: 30px;
            }

            .construction-btn {
                background-color: #10b981;
                color: white;
                padding: 12px 28px;
                text-decoration: none;
                border-radius: 6px;
                font-weight: bold;
                display: inline-block;
                transition: background 0.2s ease, transform 0.2s ease;
            }

            .construction-btn:hover {
                background-color: #059669;
                transform: translateY(-2px);
            }

            .construction-footer-text {
                margin-top: 20px;
                font-size: 0.9rem;
                color: #888;
            }

            .construction-footer-text a {
                color: #10b981;
                text-decoration: none;
            }
        </style>
    </head>
    <body class="construction-page">

        <div class="construction-container">
            <div class="construction-card">
                <i class="fa-solid fa-car-on fa-3x"></i>
                <h1>We're Polishing Things Up</h1>
                <p>Our website is currently undergoing scheduled enhancements to give you a better experience. We'll be fully live soon!</p>
                <a href="tel:+15014442461" class="construction-btn"><i class="fa-solid fa-phone"></i> Need a Detail Now? Call Us</a>
                
                <div class="construction-footer-text">
                    Serving Little Rock, AR &bull; <a href="mailto:refineddetailinglr@gmail.com">Email Us</a>
                </div>
            </div>
        </div>

    </body>
</html>
